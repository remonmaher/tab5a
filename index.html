<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tab5a</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍳%3C/text%3E%3C/svg%3E">
<style>
:root{--serif:ui-serif,'Iowan Old Style','Palatino Linotype',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',sans-serif;--bg:#f4efe6;--card:#fbf8f2;--ink:#1f2a24;--mute:#6b7469;--line:#ddd5c6;--accent:#d2461f;--green:#2f5d46;--chip:#e7e0d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[lang=ar]{--serif:'Geeza Pro','Noto Naskh Arabic','Segoe UI',Tahoma,system-ui,sans-serif;--sans:'Geeza Pro','Segoe UI',Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1c241f;--ink:#efe9dc;--mute:#97a193;--line:#2d3830;--accent:#ff7a52;--green:#8fcfa8;--chip:#26302a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);min-height:100%}
.wrap{max-width:880px;margin:0 auto;padding:24px 20px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.logo{font:600 28px var(--serif);letter-spacing:-.02em}
.logo i{color:var(--accent);font-style:normal}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-inline-start:auto}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--ink);font:600 13px var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media(max-width:560px){.tag{display:none}.lang{margin-inline-start:auto}}
h1{font:400 clamp(36px,8vw,64px)/1.15 var(--serif);letter-spacing:-.03em;margin:34px 0 12px}
h1 em{color:var(--accent);font-style:italic}
[lang=ar] h1,[lang=ar] .logo,[lang=ar] .card h2,[lang=ar] .tag{letter-spacing:0}
[lang=ar] h1 em{font-style:normal}
.lead{color:var(--mute);max-width:540px;margin:0 0 26px}
[hidden]{display:none!important}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:999px;padding:4px;max-width:560px;margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--ink);font:500 14px var(--sans);padding:10px 6px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.drop{display:block;border:1.5px dashed var(--mute);border-radius:20px;background:var(--card);padding:32px 20px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover{border-color:var(--accent)}
.drop b{font:600 22px var(--serif);display:block;margin-bottom:4px}
.drop span{color:var(--mute);font-size:14px}
.drop input{display:none}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.go{margin-top:18px;border:0;background:var(--accent);color:#fff;font:600 16px var(--sans);padding:14px 28px;border-radius:999px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.status{margin-top:22px;color:var(--mute);font:italic 20px var(--serif)}
.err{color:var(--accent)}
#out{margin-top:34px}
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{background:var(--chip);border-radius:999px;padding:5px 13px;font-size:14px}
.chip.miss{background:none;border:1px dashed var(--accent);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.card h2{font:600 27px/1.25 var(--serif);letter-spacing:-.02em;margin:0 0 6px}
.meta{color:var(--mute);font-size:14px;margin-bottom:14px}
.meta span+span::before{content:"·";margin:0 8px}
.pic{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--chip),var(--line));display:grid;place-items:center;margin-bottom:16px;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:46px;opacity:.55}
.skel{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.55}}
.cr{position:absolute;bottom:8px;inset-inline-end:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 9px;border-radius:99px;text-decoration:none}
ol{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:10px 0;padding-inline-start:46px;border-top:1px solid var(--line)}
ol li::before{content:counter(s);position:absolute;inset-inline-start:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--bg);display:grid;place-items:center;font:600 14px var(--sans)}
ul.ing{list-style:none;margin:0 0 6px;padding:0;columns:2;gap:24px}
ul.ing li{padding:5px 0;border-bottom:1px solid var(--line);break-inside:avoid}
details summary{cursor:pointer;font-weight:600;color:var(--green);margin-top:12px}
.tip{margin-top:14px;padding:12px 14px;background:var(--chip);border-radius:12px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px var(--sans);cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
.dish{display:flex;gap:14px;align-items:center;cursor:pointer;padding:16px}
.dish:hover{border-color:var(--accent)}
.dish>div:last-child{flex:1}
.dish h2{font-size:20px;margin:0 0 2px}
.thumb{width:84px;height:84px;border-radius:14px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.back{border:0;background:none;color:var(--green);font:600 15px var(--sans);cursor:pointer;padding:0;margin-bottom:14px}
.back::before{content:"←";margin-inline-end:6px}
[dir=rtl] .back::before{content:"→"}
.foot{font-size:13px;color:var(--mute);margin-top:40px}
.foot a{color:var(--green)}
@media(max-width:560px){ul.ing{columns:1}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo"><span data-i18n="brand">Tab5a</span><i>.</i></div>
<div class="tag" data-i18n="tag"></div>
<div class="lang"><button data-l="en" aria-pressed="true">EN</button><button data-l="ar" aria-pressed="false">عربي</button></div>
</header>
<h1><span data-i18n="h1a"></span><br><em data-i18n="h1b"></em></h1>
<p class="lead" data-i18n="lead"></p>
<div class="tabs" role="tablist">
<button role="tab" id="t-fridge" aria-selected="true" data-i18n="tabF"></button>
<button role="tab" id="t-dish" aria-selected="false" data-i18n="tabD"></button>
<button role="tab" id="t-pop" aria-selected="false" data-i18n="tabP"></button>
</div>
<div id="pop" hidden>
<div class="opts"><button data-r="world" data-i18n="rW" aria-pressed="true"></button><button data-r="egypt" data-i18n="rE" aria-pressed="false"></button><button data-r="arab" data-i18n="rM" aria-pressed="false"></button><button data-r="italy" data-i18n="rI" aria-pressed="false"></button><button data-r="asia" data-i18n="rA" aria-pressed="false"></button><button data-r="americas" data-i18n="rU" aria-pressed="false"></button></div>
<div class="opts"><button data-k="classic" data-i18n="kC" aria-pressed="true"></button><button data-k="trend" data-i18n="kT" aria-pressed="false"></button></div>
<button class="go" id="showl" data-i18n="showL" style="margin-top:6px"></button>
<p class="foot" style="margin-top:12px" data-i18n="popNote"></p>
</div>
<label class="drop" id="drop"><b id="dtitle"></b><span id="dsub"></span><input type="file" id="file" accept="image/*" multiple></label>
<div class="thumbs" id="thumbs"></div>
<button class="go" id="go" disabled></button>
<div class="status" id="status" hidden></div>
<div id="out"></div>
<p class="foot"><span data-i18n="trouble"></span> <a href="/api/ai" data-i18n="test"></a> · v7</p>
</div>
<script>
window.addEventListener('error',e=>{try{status('Page error: '+e.message,true)}catch(_){}});
const $=s=>document.querySelector(s);
const T={
en:{title:'Tab5a: photo to recipe',brand:'Tab5a',tag:'photo to plate',h1a:'Show me the food.',h1b:'I’ll show you how.',lead:'Snap your fridge and get dinner ideas with steps. Or snap a dish you love and get the full recipe.',tabF:'Fridge → Meals',tabD:'Dish → Recipe',dtF:'Add photos of your fridge or pantry',dsF:'Tap to take a photo or choose up to 4 images',dtD:'Add a photo of a dish or dessert',dsD:'Tap to take a photo or choose an image',goF:'Cook something up',goD:'Get the recipe',look:'Looking closely…',see:'I can see',make:'You could make',ing:'Ingredients',method:'Method',tip:'Chef’s tip: ',need:'need:',steps:'Show step-by-step',serves:'Serves',trouble:'Trouble?',test:'Test the server',noread:'I couldn’t read that photo. Try another one.',slow:'That took too long. Try one smaller photo.',nofood:'I couldn’t find food in that photo. Try another.',problem:'Problem: ',tabP:'Popular',popNote:'AI picks from its general knowledge, not live rankings.',rW:'World',rE:'Egypt',rM:'Middle East',rI:'Italy',rA:'Asia',rU:'Americas',kC:'Classics',kT:'Trending',showL:'Show dishes',back:'Back',pick:'Picking dishes…',writing:'Writing the recipe…'},
ar:{title:'طبخة | من الصورة للوصفة',brand:'طبخة',tag:'من الصورة للطبق',h1a:'وريني الأكل..',h1b:'وأنا أقولك تعمله إزاي.',lead:'صوّر التلاجة وهتلاقي أكلات تطبخها بخطوات سهلة. أو صوّر أكلة عجباك وخد وصفتها كاملة.',tabF:'من التلاجة لوجبة',tabD:'من الأكلة لوصفة',dtF:'ضيف صور للتلاجة أو المخزن',dsF:'دوس عشان تصوّر أو تختار لحد ٤ صور',dtD:'ضيف صورة أكلة أو حلو',dsD:'دوس عشان تصوّر أو تختار صورة',goF:'يلا نطبخ',goD:'هات الوصفة',look:'ثواني.. ببص على الصورة',see:'شايف عندك',make:'تقدر تعمل',ing:'المكوّنات',method:'الطريقة',tip:'نصيحة الشيف: ',need:'ناقصك:',steps:'شوف الخطوات',serves:'يكفي',trouble:'فيه مشكلة؟',test:'جرّب السيرفر',noread:'معرفتش أقرا الصورة دي. جرّب غيرها.',slow:'الموضوع اتأخر أوي. جرّب صورة أصغر.',nofood:'مش شايف أكل في الصورة دي. جرّب غيرها.',problem:'في مشكلة: ',tabP:'ترند الأكل',popNote:'اقتراحات من الذكاء الاصطناعي حسب معلوماته، مش ترتيب لحظي.',rW:'العالم',rE:'مصر',rM:'الشرق الأوسط',rI:'إيطاليا',rA:'آسيا',rU:'الأمريكتين',kC:'الكلاسيك',kT:'الترند',showL:'وريني الأكلات',back:'رجوع',pick:'بختار لك أكلات.. ثواني',writing:'بكتب الوصفة.. ثواني'}};
let lang='en',mode='fridge',blobs=[];
try{lang=localStorage.getItem('lang')||((navigator.language||'').slice(0,2)==='ar'?'ar':'en')}catch(_){}
const t=k=>T[lang][k];
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function apply(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  const f=mode==='fridge';
  $('#dtitle').textContent=t(f?'dtF':'dtD');$('#dsub').textContent=t(f?'dsF':'dsD');$('#go').textContent=t(f?'goF':'goD');
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(_){}
  $('#out').replaceChildren();status('');lastList=null;apply();
});
function setMode(m){
  mode=m;blobs=[];$('#thumbs').replaceChildren();$('#out').replaceChildren();$('#go').disabled=true;status('');
  $('#t-fridge').setAttribute('aria-selected',m==='fridge');$('#t-dish').setAttribute('aria-selected',m==='dish');$('#t-pop').setAttribute('aria-selected',m==='pop');
  const pop=m==='pop';$('#drop').hidden=pop;$('#thumbs').hidden=pop;$('#go').hidden=pop;$('#pop').hidden=!pop;
  $('#file').multiple=m==='fridge';$('#file').value='';apply();
}
$('#t-fridge').onclick=()=>setMode('fridge');
$('#t-dish').onclick=()=>setMode('dish');
$('#t-pop').onclick=()=>setMode('pop');

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(new Error('img'));i.src=u})}
async function shrink(file){
  const img=await loadImg(file);
  const w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,900/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise((r,j)=>c.toBlob(b=>b?r(b):j(new Error('blob')),'image/jpeg',.75));
}
$('#file').onchange=async e=>{
  const list=[...e.target.files].slice(0,mode==='fridge'?4:1);
  blobs=[];$('#thumbs').replaceChildren();status('');
  for(const f of list){
    try{const b=await shrink(f);blobs.push(b);const i=new Image();i.src=URL.createObjectURL(b);i.alt='';$('#thumbs').append(i)}catch(_){status(t('noread'),true)}
  }
  $('#go').disabled=!blobs.length;
};
function status(msg,isErr){const s=$('#status');s.hidden=!msg;s.textContent=msg||'';s.className='status'+(isErr?' err':'')}
function stepsList(steps){const o=h('ol');steps.forEach(x=>o.append(h('li',null,x)));return o}

function picBox(){const b=h('div','pic skel');b.append(h('span','ph','🍽️'));return b}
async function fetchPic(q){try{const r=await fetch('/api/img?q='+encodeURIComponent(q));const d=await r.json();return d.url?d:null}catch(_){return null}}
async function loadPic(box,q){
  const d=await fetchPic(q);if(!d)return box.remove();
  const i=new Image();i.alt=q;
  i.onload=()=>{box.classList.remove('skel');box.replaceChildren(i);const a=h('a','cr','📷 '+d.credit);a.href=d.creditUrl;a.target='_blank';a.rel='noopener';box.append(a)};
  i.onerror=()=>box.remove();i.src=d.url;
}
function renderFridge(d){
  const out=$('#out');out.replaceChildren();
  out.append(h('p','sec',t('see')));
  const c=h('div','chips');(d.ingredients||[]).forEach(x=>c.append(h('span','chip',x)));out.append(c);
  out.append(h('p','sec',t('make')));
  (d.recipes||[]).forEach((r,i)=>{
    const card=h('div','card');card.style.animationDelay=i*90+'ms';
    const pic=picBox();card.append(pic);loadPic(pic,r.photo||r.name);
    card.append(h('h2',null,r.name));
    const m=h('div','meta');[r.time,r.difficulty].filter(Boolean).forEach(x=>m.append(h('span',null,x)));card.append(m);
    const ch=h('div','chips');ch.style.marginBottom='8px';
    (r.uses||[]).forEach(x=>ch.append(h('span','chip',x)));
    (r.missing||[]).forEach(x=>ch.append(h('span','chip miss',t('need')+' '+x)));
    card.append(ch);
    const det=h('details');det.append(h('summary',null,t('steps')));det.append(stepsList(r.steps||[]));
    if(i===0)det.open=true;
    card.append(det);out.append(card);
  });
}
function renderDish(d,q,back){
  const out=$('#out');out.replaceChildren();
  if(back){const bb=h('button','back',t('back'));bb.onclick=()=>lastList&&renderList(lastList);out.append(bb)}
  const card=h('div','card');
  if(q){const pic=picBox();card.append(pic);loadPic(pic,q)}
  else{const pic=h('div','pic');const mine=new Image();mine.alt=d.name||'';mine.src=URL.createObjectURL(blobs[0]);pic.append(mine);card.append(pic)}
  card.append(h('h2',null,d.name));
  const m=h('div','meta');[d.cuisine,d.time,d.servings&&(t('serves')+' '+d.servings)].filter(Boolean).forEach(x=>m.append(h('span',null,x)));card.append(m);
  card.append(h('p','sec',t('ing')));
  const u=h('ul','ing');(d.ingredients||[]).forEach(x=>{const l=h('li');l.append(h('b',null,x.amount?x.amount+' ':''),document.createTextNode(x.item));u.append(l)});
  card.append(u);
  card.append(h('p','sec',t('method')));card.append(stepsList(d.steps||[]));
  if(d.tip)card.append(h('div','tip',t('tip')+d.tip));
  out.append(card);
}
function langRule(){return lang==='ar'
  ?'Write every text value (names, ingredients, amounts, times, difficulty, steps, tips) in friendly Egyptian Arabic slang (عامية مصرية) as an Egyptian home cook would speak, using words like دلوقتي وعشان وكده وشوية ولحد ما. Keep JSON keys in English, and keep the "photo" field in English.'
  :'Write all text values in clear, friendly English. Keep JSON keys in English.'}

$('#go').onclick=async()=>{
  $('#go').disabled=true;$('#out').replaceChildren();status(t('look'));
  try{
    const prompt=mode==='fridge'
      ?'You are a friendly home chef. Look at the attached fridge/pantry photos. Identify the food items you can actually see. Then suggest 4 realistic recipes using mostly those items (assume salt, pepper, oil and water). Return ONLY JSON: {"ingredients":[string],"recipes":[{"name":string,"photo":string,"time":string,"difficulty":string,"uses":[string],"missing":[string],"steps":[string]}]}. "photo" is 2 to 4 English words naming the finished dish for a photo search. Steps must be clear and specific, 5 to 8 per recipe. If there is no food, return {"error":"short explanation"}. '+langRule()
      :'You are a professional chef. Identify the dish or dessert in the attached photo and write a complete home recipe. Return ONLY JSON: {"name":string,"photo":string,"cuisine":string,"time":string,"servings":number,"ingredients":[{"amount":string,"item":string}],"steps":[string],"tip":string}. Steps must be clear and specific, with temperatures and times. If the photo shows no food, return {"error":"short explanation"}. '+langRule();
    const images=await Promise.all(blobs.map(b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)})));
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),55000);
    const res=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,images}),signal:ac.signal});clearTimeout(to);
    if(!res.ok){let m='';try{m=(await res.json()).error}catch(_){}throw new Error(m||('Server error '+res.status))}
    const d=await res.json();
    if(!d||d.error){status(t('nofood'),true);return}
    status('');mode==='fridge'?renderFridge(d):renderDish(d);
  }catch(e){
    console.error(e);status(e&&e.name==='AbortError'?t('slow'):t('problem')+((e&&e.message)||''),true);
  }finally{$('#go').disabled=!blobs.length}
};

let popR='world',popK='classic',lastList=null;
const RN={world:'around the world',egypt:'Egypt',arab:'the Middle East and Arab world',italy:'Italy',asia:'Asia',americas:'the Americas'};
function sync(){document.querySelectorAll('[data-r]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===popR));document.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===popK))}
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{popR=b.dataset.r;sync()});
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{popK=b.dataset.k;sync()});
async function callAI(prompt,images){
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),55000);
  const res=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,images:images||[]}),signal:ac.signal});clearTimeout(to);
  if(!res.ok){let m='';try{m=(await res.json()).error}catch(_){}throw new Error(m||('Server error '+res.status))}
  return res.json();
}
function fail(e){console.error(e);status(e&&e.name==='AbortError'?t('slow'):t('problem')+((e&&e.message)||''),true)}
function renderList(d){
  const out=$('#out');out.replaceChildren();
  (d.dishes||[]).forEach((x,i)=>{
    const c=h('div','card dish');c.style.animationDelay=i*50+'ms';c.tabIndex=0;c.setAttribute('role','button');
    const th=h('div','thumb');th.hidden=true;const tx=h('div');tx.append(h('h2',null,x.name),h('div','meta',x.blurb));c.append(th,tx);
    fetchPic(x.photo||x.name).then(p=>{if(!p)return;const im=new Image();im.alt='';im.onload=()=>{th.hidden=false;th.append(im)};im.src=p.url});
    const open=()=>openDish(x);c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter')open()};out.append(c);
  });
}
async function showList(){
  status(t('pick'));$('#out').replaceChildren();$('#showl').disabled=true;
  try{
    const kind=popK==='classic'?'the most beloved, popular classic dishes that people actually cook and eat':'dishes that have been trending recently in restaurants, social media and home cooking';
    const d=await callAI('List 10 of '+kind+', from '+RN[popR]+'. Use your general knowledge (this is not live data). Return ONLY JSON {"dishes":[{"name":string,"photo":string,"blurb":string}]}. "photo" is the exact, common English name of the dish. "blurb" is one short sentence. '+langRule());
    status('');lastList=d;renderList(d);
  }catch(e){fail(e)}finally{$('#showl').disabled=false}
}
async function openDish(x){
  status(t('writing'));$('#out').replaceChildren();
  try{
    const d=await callAI('Write a complete home recipe for the dish "'+(x.photo||x.name)+'" (shown to the user as "'+x.name+'"). Return ONLY JSON {"name":string,"cuisine":string,"time":string,"servings":number,"ingredients":[{"amount":string,"item":string}],"steps":[string],"tip":string}. Steps must be clear and specific, with temperatures and times. '+langRule());
    status('');renderDish(d,x.photo||x.name,true);scrollTo(0,0);
  }catch(e){fail(e);if(lastList)renderList(lastList)}
}
$('#showl').onclick=showList;
apply();
</script>
